name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed for PR decoration/comments
    env:
      DB_CONNECTION_STRING: "mysql+mysqlconnector://user:password@localhost/dbname"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # <-- required for the new action
      # No SONAR_HOST_URL for SonarCloud

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests with Coverage
        run: |
          mkdir -p reports
          pytest --junitxml=reports/results.xml --cov=app --cov-report=xml
          # Ensure coverage XML paths are correct & in expected location
          coverage xml -i || true
          if [ -f coverage.xml ]; then mv -f coverage.xml reports/coverage.xml; fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # for PR decoration
        with:
          args: >
            -Dsonar.projectKey=ManassehV2_aptarapi
            -Dsonar.organization=manassehv2
            -Dsonar.sources=app
            -Dsonar.python.coverage.reportPaths=reports/coverage.xml
            -Dsonar.python.xunit.reportPath=reports/results.xml
            -Dsonar.coverage.exclusions=tests/**,app/ppetask.py,app/palletstask.py,app/forklifttask.py,app/commontasks.py,app/routers/detection.py,app/main.py,app/crud.py,app/routers/report.py,app/db_init.py
